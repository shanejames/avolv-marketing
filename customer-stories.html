<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/avolv-theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Stories | Avolv.ai</title>
  <meta name="description" content="Real pool and home-service owners on what changed after moving to Avolv. Video testimonials and customer stories in their own words.">
  <link rel="canonical" href="https://avolv.ai/customer-stories.html">
  <meta property="og:title" content="Customer Stories | Avolv.ai">
  <meta property="og:description" content="Real owners on what changed after moving to Avolv, in their own words.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://avolv.ai/customer-stories.html">
  <meta property="og:image" content="https://app.avolv.ai/avolv-logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Customer Stories | Avolv.ai">
  <meta name="twitter:description" content="Real owners on what changed after moving to Avolv, in their own words.">
  <meta name="twitter:image" content="https://app.avolv.ai/avolv-logo.png">
  <link rel="icon" type="image/png" href="https://app.avolv.ai/avolv-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--av-page); color: var(--av-text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: var(--av-blue-600); text-decoration: none; } a:hover { color: var(--av-blue-700); }

    .cs-hero { max-width: 900px; margin: 0 auto; padding: 56px 24px 24px; text-align: center; }
    .cs-hero h1 { color: var(--av-heading); font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 800; line-height: 1.1; }
    .cs-hero p { color: var(--av-muted); font-size: 1.1rem; margin-top: 14px; max-width: 640px; margin-left: auto; margin-right: auto; }

    .cs-wrap { max-width: 1180px; margin: 0 auto; padding: 24px 24px 72px; }
    .cs-section-title { color: var(--av-heading); font-size: 1.35rem; font-weight: 700; margin: 40px 0 18px; }

    .cs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    @media (max-width: 900px) { .cs-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 620px) { .cs-grid { grid-template-columns: 1fr; } }

    .cs-card { background: var(--av-surface); border: 1px solid var(--av-border); border-radius: 16px; overflow: hidden; box-shadow: var(--av-shadow-sm); display: flex; flex-direction: column; }
    .cs-card video { width: 100%; aspect-ratio: 16 / 9; background: #000; object-fit: contain; display: block; }
    .cs-card .cs-body { padding: 14px 16px 16px; }
    .cs-q { font-size: .82rem; color: var(--av-faint); font-weight: 600; }
    .cs-who { margin-top: 8px; font-weight: 700; color: var(--av-heading); }
    .cs-co { color: var(--av-muted); font-size: .9rem; }

    .cs-quote { background: var(--av-surface); border: 1px solid var(--av-border); border-radius: 16px; padding: 22px; box-shadow: var(--av-shadow-sm); display: flex; flex-direction: column; gap: 12px; }
    .cs-quote .stars { color: var(--av-amber); font-size: .95rem; letter-spacing: 1px; }
    .cs-quote blockquote { color: var(--av-text); font-size: 1.02rem; line-height: 1.6; }
    .cs-quote .cs-attr { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
    .cs-quote .cs-attr img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 1px solid var(--av-border); }
    .cs-quote .cs-logo { max-height: 30px; max-width: 120px; object-fit: contain; }
    .cs-nums { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .cs-num { background: var(--av-blue-50); border: 1px solid var(--av-blue-100); border-radius: 10px; padding: 6px 10px; font-size: .8rem; color: var(--av-heading); }
    .cs-num b { color: var(--av-blue-700); }

    .cs-state { text-align: center; color: var(--av-muted); padding: 48px 0; }
    .cs-cta { text-align: center; margin: 56px auto 0; }
    .cs-cta a { display: inline-block; background: var(--av-blue-600); color: #fff; font-weight: 700; padding: 14px 26px; border-radius: 12px; }
    .cs-cta a:hover { background: var(--av-blue-700); color: #fff; }
  </style>
  <script type="module" src="/heycatch-analytics.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <script src="/site-header.js"></script>

  <main>
    <section class="cs-hero">
      <h1>Customer stories</h1>
      <p>Real pool and home-service owners on what changed after moving to Avolv, in their own words.</p>
    </section>

    <div class="cs-wrap">
      <div id="cs-loading" class="cs-state">Loading stories&hellip;</div>

      <section id="cs-videos-section" hidden>
        <h2 class="cs-section-title">On video</h2>
        <div id="cs-videos" class="cs-grid"></div>
      </section>

      <section id="cs-written-section" hidden>
        <h2 class="cs-section-title">In their words</h2>
        <div id="cs-written" class="cs-grid"></div>
      </section>

      <div id="cs-empty" class="cs-state" hidden>Customer stories are on the way. Check back soon.</div>

      <div class="cs-cta">
        <a href="/get-started.html">See Avolv for your business</a>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/site-footer.js"></script>

  <script>
    (function () {
      var FEED = 'https://app.avolv.ai/api/public/stories';

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }
      function attribution(name, title, company) {
        var parts = [];
        if (name) parts.push(name);
        if (title) parts.push(title);
        if (company) parts.push(company);
        return parts.join(', ');
      }

      function renderVideos(videos) {
        var grid = document.getElementById('cs-videos');
        videos.forEach(function (v) {
          var card = el('div', 'cs-card');
          var vid = document.createElement('video');
          vid.controls = true;
          vid.playsInline = true;
          vid.preload = 'none';
          if (v.posterUrl) vid.poster = v.posterUrl;
          vid.src = v.videoUrl;
          card.appendChild(vid);

          var body = el('div', 'cs-body');
          if (v.question) body.appendChild(el('div', 'cs-q', v.question));
          var who = attribution(v.name, v.title, null);
          if (who) body.appendChild(el('div', 'cs-who', who));
          if (v.company) body.appendChild(el('div', 'cs-co', v.company));
          card.appendChild(body);
          grid.appendChild(card);
        });
        document.getElementById('cs-videos-section').hidden = false;
      }

      function renderWritten(items) {
        var grid = document.getElementById('cs-written');
        items.forEach(function (t) {
          var card = el('div', 'cs-quote');
          if (t.rating) {
            var r = Math.max(0, Math.min(5, Math.round(t.rating)));
            card.appendChild(el('div', 'stars', '★'.repeat(r) + '☆'.repeat(5 - r)));
          }
          if (t.quote) {
            var bq = el('blockquote', null, '“' + t.quote + '”');
            card.appendChild(bq);
          }
          if (Array.isArray(t.numbers) && t.numbers.length) {
            var nums = el('div', 'cs-nums');
            t.numbers.slice(0, 3).forEach(function (n) {
              var chip = el('div', 'cs-num');
              var b = el('b', null, String(n.value));
              chip.appendChild(b);
              chip.appendChild(document.createTextNode(' ' + n.label));
              nums.appendChild(chip);
            });
            card.appendChild(nums);
          }
          var attr = el('div', 'cs-attr');
          if (t.photoUrl) {
            var img = document.createElement('img');
            img.src = t.photoUrl;
            img.alt = t.name || 'Customer';
            attr.appendChild(img);
          }
          var meta = el('div');
          var who = attribution(t.name, t.title, t.company);
          if (who) meta.appendChild(el('div', 'cs-who', who));
          attr.appendChild(meta);
          if (t.logoUrl) {
            var logo = document.createElement('img');
            logo.src = t.logoUrl;
            logo.alt = (t.company || 'Customer') + ' logo';
            logo.className = 'cs-logo';
            logo.style.marginLeft = 'auto';
            attr.appendChild(logo);
          }
          card.appendChild(attr);
          grid.appendChild(card);
        });
        document.getElementById('cs-written-section').hidden = false;
      }

      fetch(FEED, { headers: { 'Accept': 'application/json' } })
        .then(function (r) { if (!r.ok) throw new Error('feed ' + r.status); return r.json(); })
        .then(function (data) {
          document.getElementById('cs-loading').hidden = true;
          var videos = Array.isArray(data.videos) ? data.videos : [];
          var written = Array.isArray(data.testimonials) ? data.testimonials : [];
          if (videos.length) renderVideos(videos);
          if (written.length) renderWritten(written);
          if (!videos.length && !written.length) document.getElementById('cs-empty').hidden = false;
        })
        .catch(function () {
          document.getElementById('cs-loading').hidden = true;
          document.getElementById('cs-empty').hidden = false;
        });
    })();
  </script>
</body>
</html>
